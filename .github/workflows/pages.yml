name: Publish to GitHub Pages

# Pages serves the gh-pages branch (auto-enabled when that branch first appeared).
# This workflow keeps it in sync: every push to the development branch fast-forwards
# gh-pages to the same commit, so the live site always matches the latest code.
on:
  push:
    branches: [claude/factorio-discussion-5b57cy]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update gh-pages
        run: git push origin HEAD:gh-pages --force
